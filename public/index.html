<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mis Calificaciones</h1>
        <div class="mode-selection">
            <button class="mode-btn" data-mode="presencial">Estudiante Presencial</button>
            <button class="mode-btn" data-mode="enlinea">Estudiante en Línea</button>
            <button class="mode-btn" data-mode="otra">Otra</button>
        </div>
        <div class="login-form" style="display: none;">
            <input type="text" id="username" placeholder="Usuario">
            <input type="password" id="password" placeholder="Contraseña">
            <button id="login-btn">Iniciar Sesión</button>
        </div>
        <div class="grades-container" style="display: none;">
            <div class="grades-header">
                <h2 id="career-name"></h2>
                <h3 id="student-name"></h3>
            </div>
            <div class="grades-table">
                <!-- Grades will be inserted here -->
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
